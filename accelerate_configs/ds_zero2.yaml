compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  zero_stage: 2
mixed_precision: bf16
same_network: true
downcast_bf16: 'no'

# 👇 update for multi-node
num_machines: 2          # total number of nodes
num_processes: 16        # total GPUs (8 × 2)
machine_rank: 0          # will be overridden from CLI per node
rdzv_backend: static
use_cpu: false
